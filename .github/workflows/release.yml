name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows (NSIS + portable)
        working-directory: desktop
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Windows assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          generate_release_notes: true

  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Package DMG + ZIP
        run: |
          APP="build/动薪.app"
          test -d "$APP"
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -sf /Applications dist/dmg/Applications
          hdiutil create -volname "DongXin" -srcfolder dist/dmg -ov -format UDZO \
            "dist/DongXin-${GITHUB_REF_NAME}-macOS.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/DongXin-${GITHUB_REF_NAME}-macOS.zip"
          ls -lh dist
      - name: Upload macOS assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
